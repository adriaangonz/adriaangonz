<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" role="img" aria-label="Adrián González - Perfil de GitHub">
  <defs>
    <linearGradient id="accentLine-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.1s steps(1, end) infinite; }
      @keyframes pulseGlyph { 0%, 100% { opacity: 0.92; } 50% { opacity: 1; } }
      .glyph { animation: pulseGlyph 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Window frame -->
  <rect x="1" y="1" width="878" height="230" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- Top bar -->
  <path d="M13 1.75 H867 A11.25 11.25 0 0 1 878.25 13 V36 H1.75 V13 A11.25 11.25 0 0 1 13 1.75 Z" fill="#161b22"/>
  <line x1="1" y1="36" x2="879" y2="36" stroke="#30363d" stroke-width="1"/>
  <rect x="1" y="35" width="878" height="1.5" fill="url(#accentLine-dark)" opacity="0.55"/>

  <!-- Window dots + title -->
  <circle cx="22" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="39" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="19" r="5" fill="#27c93f"/>
  <text x="440" y="23" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">adrian@omarchy — hyprland — zsh</text>

  <!-- Left badge / geometric Arch-inspired monogram -->
  <rect x="28" y="56" width="164" height="152" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <g class="glyph" transform="translate(110, 122)">
    <!-- Minimalist stylized A / peak -->
    <polygon points="0,-46 42,34 26,34 15,12 -15,12 -26,34 -42,34" fill="none" stroke="#58a6ff" stroke-width="3.2" stroke-linejoin="round"/>
    <polygon points="0,-24 10,0 -10,0" fill="#39d353" opacity="0.88"/>
    <line x1="-22" y1="22" x2="22" y2="22" stroke="#58a6ff" stroke-width="2" opacity="0.5"/>
  </g>
  <text x="110" y="191" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#8b949e">@adriaangonz</text>

  <!-- Right terminal content -->
  <g transform="translate(220, 74)">
    <text x="0" y="0" class="mono" font-size="13.5"><tspan fill="#39d353" font-weight="700">adrian@omarchy</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff" font-weight="700">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">fastfetch --profile </tspan><tspan fill="#58a6ff" class="cursor">█</tspan></text>

    <line x1="0" y1="14" x2="626" y2="14" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="0" y="39" class="mono" font-size="13.5" fill="#58a6ff" font-weight="700">nombre</text>
    <text x="82" y="39" class="mono" font-size="13.5" fill="#8b949e">::</text>
    <text x="108" y="39" class="mono" font-size="13.5" fill="#e6edf3" font-weight="600">Adrián González</text>

    <text x="0" y="63" class="mono" font-size="13.5" fill="#58a6ff" font-weight="700">estudios</text>
    <text x="82" y="63" class="mono" font-size="13.5" fill="#8b949e">::</text>
    <text x="108" y="63" class="mono" font-size="13.5" fill="#e6edf3">2.º DAM · Desarrollo de Aplicaciones Multiplataforma</text>

    <text x="0" y="87" class="mono" font-size="13.5" fill="#58a6ff" font-weight="700">zona</text>
    <text x="82" y="87" class="mono" font-size="13.5" fill="#8b949e">::</text>
    <text x="108" y="87" class="mono" font-size="13.5" fill="#e6edf3">Cantabria, España</text>

    <text x="0" y="111" class="mono" font-size="13.5" fill="#58a6ff" font-weight="700">entorno</text>
    <text x="82" y="111" class="mono" font-size="13.5" fill="#8b949e">::</text>
    <text x="108" y="111" class="mono" font-size="13.5" fill="#e6edf3">Omarchy (Arch Linux) · Docker · Git</text>

    <text x="0" y="135" class="mono" font-size="13.5" fill="#58a6ff" font-weight="700">enfoque</text>
    <text x="82" y="135" class="mono" font-size="13.5" fill="#8b949e">::</text>
    <text x="108" y="135" class="mono" font-size="13.5" fill="#e6edf3">Apps multiplataforma, backend, bases de datos y automatización</text>
  </g>
</svg>
